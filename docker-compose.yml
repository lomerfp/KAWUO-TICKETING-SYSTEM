version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: kawuo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kawuo_itsm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kawuo-redis
    ports:
      - "6379:6379"

  web:
    build: ./backend
    container_name: kawuo-web
    command: gunicorn kawuo_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kawuo_itsm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:alpine
    container_name: kawuo-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
